[metadata]
name = python-dali
version = 0.14
description = Interface to DALI lighting systems
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Stephen Early
author_email = steve@assorted.org.uk
url = https://github.com/sde1000/python-dali
license = "LGPL-3.0-or-later"
license_files =
    COPYING
    COPYING.LESSER
    LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3

[options]
python_requires = >=3.10
include_package_data = True
packages =
    dali
    dali.device
    dali.driver
    dali.gear
    dali.memory
    dali.tests

[options.extras_require]
driver-unipi =
    pyusb
    pymodbus
    pyserial
driver-serial = serialx>=1.11.0
test =
    pytest
    pytest-asyncio
    pymodbus
    pyserial
    serialx>=1.11.0

[flake8]
exclude = */driver/
ignore = E741, F403, F405, W503
# Please write with max-line-length = 80 where possible
max-line-length = 103
